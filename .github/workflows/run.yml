name: 刷步数

on:
  schedule:
    # 北京时间 21:30 (UTC 13:30)
    - cron: '30 13 * * *'
    # 北京时间 22:30 (UTC 14:30)
    - cron: '30 14 * * *'
    # 北京时间 23:30 (UTC 15:30)
    - cron: '30 15 * * *'
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v3
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: 开始
        env:
          CONFIG: ${{secrets.CONFIG }}
        run: |
          pip3 install requests
          python3 main.py
